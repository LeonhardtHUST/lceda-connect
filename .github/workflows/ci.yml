name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# 工具链约定：
#
# pnpm：版本只在 package.json 的 packageManager 字段里声明（pnpm@12.21.0）。
#   pnpm/action-setup 不传 version，直接按 packageManager 装，两处版本对不上 CI 会失败。
#   pnpm 12 会把解析到的包管理器版本写进 pnpm-lock.yaml 的第一个 YAML 文档
#   （packageManagerDependencies），所以 package.json 与 pnpm-lock.yaml 必须一起改。
#   只改一边，pnpm install --frozen-lockfile 会拒绝安装。
#
# Node：开发工具链 vite-plus@1.6 的 engines 是 ^22.18.0 || ^24.11.0 || >=26.0.0，
#   Node 20 上 vp 无法运行，所以 vp check / vp test / vp pack 只在 Node 22、24 上跑。
#   产物声明的 engines 下限是 Node 20.11，这一条由 runtime-node20 验证：
#   用 Node 24 构建，再切到 Node 20.11 运行同一份 dist 产物（CLI、MCP、库入口）。
#   工作流里 vp 只出现在 Node 22/24 的步骤中，Node 20.11 的 job 不跑 vp。

jobs:
  ci:
    name: ci (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与 lint（vp check）
        run: pnpm exec vp check

      - name: 测试（vp test）
        run: pnpm exec vp test

      - name: 构建（vp pack）
        run: pnpm exec vp pack

      # npm pack --dry-run 给出 JSON，里面带解包体积和文件数；超过门槛就失败。
      - name: 校验包体积与文件数
        shell: bash
        run: |
          node -e '
          const { execSync } = require("node:child_process");
          const out = execSync("npm pack --dry-run --json", { encoding: "utf8" });
          const info = JSON.parse(out)[0];
          if (!info) throw new Error("npm pack --dry-run 没有返回包信息");
          const files = info.entryCount ?? info.files.length;
          const mb = info.unpackedSize / 1024 / 1024;
          console.log(`解包体积 ${mb.toFixed(2)} MB，文件数 ${files}`);
          if (mb >= 15) throw new Error("解包体积超过 15 MB");
          if (files >= 2500) throw new Error("文件数超过 2500");
          '

  # Node 20.11 是产物声明的运行时下限，但跑不了 vite-plus（engines 要求 ^22.18 / ^24.11 / >=26）。
  # 这里用 Node 24 构建，然后把运行时切到 20.11，对同一份 dist 做等价的运行时冒烟：
  # CLI 版本、子命令帮助、MCP 工具清单、MCP stdio initialize 握手、库入口 API。
  runtime-node20:
    name: runtime (${{ matrix.os }} / node 20.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: 安装依赖并构建
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vp pack

      - uses: actions/setup-node@v4
        with:
          node-version: "20.11"

      - name: 确认运行时已切到 20.11
        shell: bash
        run: |
          node --version
          node -e '
          const [major, minor] = process.versions.node.split(".").map(Number);
          if (major !== 20 || minor !== 11) {
            throw new Error(`期望 Node 20.11，实际 ${process.versions.node}`);
          }
          '

      - name: 在 Node 20.11 上运行 CLI 与 MCP 工具清单
        shell: bash
        run: |
          set -euo pipefail
          node dist/cli.mjs --version
          node dist/cli-cdp.mjs --help > /dev/null
          node dist/cli-bridge.mjs --help > /dev/null
          # mcp tools 每行一个工具：名称 + 描述。
          n=$(node dist/cli.mjs mcp tools | grep -cE '^[a-z][a-z0-9_]+ ' || true)
          echo "MCP 工具 $n 个"
          test "$n" -ge 10

      - name: 在 Node 20.11 上验证库入口与 MCP 握手
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
          import { allTools, loadConfig, packageVersion } from "./dist/index.mjs";
          const tools = allTools();
          if (tools.length < 10) throw new Error(`工具数 ${tools.length} < 10`);
          if (packageVersion() !== "0.1.0") throw new Error(`版本 ${packageVersion()}`);
          const config = loadConfig({});
          if (config.cdp.port !== 9222) throw new Error(`默认 CDP 端口 ${config.cdp.port}`);
          console.log(`库入口可用：${tools.length} 个工具，版本 ${packageVersion()}`);
          '
          # MCP stdio：发一条 initialize，确认服务端返回 serverInfo。
          response=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | node dist/cli-mcp.mjs 2>/dev/null)
          echo "$response"
          printf '%s' "$response" | grep -q '"serverInfo"'

  # 单独跑一遍装好 ngspice 的测试，覆盖未装 ngspice 时被跳过的分支。
  ngspice:
    name: ngspice (ubuntu-latest / node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          command -v ngspice

      - name: 测试（含真实 ngspice 分支）
        run: pnpm exec vp test
